version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: visionguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-visionguard}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - visionguard-net
    # Database publishes NO port to the outside host, only accessible inside Docker network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-visionguard}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: visionguard-api
    restart: unless-stopped
    environment:
      - API_KEY=${API_KEY:-visionguard_secret_key}
      - PORT=10000
    ports:
      - "10000:10000"
    networks:
      - visionguard-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: visionguard-web
    restart: unless-stopped
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-visionguard}
      - API_URL=http://api:10000
      - API_KEY=${API_KEY:-visionguard_secret_key}
    ports:
      - "5000:5000"
    networks:
      - visionguard-net
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  db_data:
    name: visionguard_db_data

networks:
  visionguard-net:
    driver: bridge
