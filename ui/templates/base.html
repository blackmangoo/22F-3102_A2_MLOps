<!doctype html>
<html><head><meta charset="utf-8"><title>VisionGuard</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0}
nav{background:#1f2a44;padding:14px 30px}
nav a{color:#fff;margin-right:22px;text-decoration:none;font-weight:bold}
main{max-width:760px;margin:30px auto;background:#fff;padding:28px;border-radius:10px;box-shadow:0 2px 8px #0002}
button{background:#3b6ef5;color:#fff;border:0;padding:10px 20px;border-radius:6px;cursor:pointer}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
.ai{color:#c0392b;font-weight:bold}.real{color:#1e8449;font-weight:bold}
.note{font-size:13px;color:#666;margin-top:18px}
</style></head><body>
<nav><a href="/">VisionGuard</a><a href="/history">History</a><a href="/health">Health</a></nav>
<main>{% block body %}{% endblock %}</main></body></html>
